<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Возврат звонков — Подтверждение номера</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4f8fd;
      font-family: Arial, system-ui, sans-serif;
      color: #17233b;
      min-height: 100vh;
    }
    .page {
      max-width: 560px;
      margin: 30px auto;
      padding: 36px 32px 40px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 15px 50px #23466b18;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #123d78;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      background: #1976e8;
      color: white;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 20px;
    }
    .steps {
      display: flex;
      justify-content: space-between;
      margin-bottom: 36px;
      padding: 0 4px;
    }
    .step {
      text-align: center;
      color: #71809a;
      font-size: 12px;
      flex: 1;
      position: relative;
    }
    .step b {
      display: block;
      margin: 0 auto 6px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      line-height: 32px;
      background: #dce7f5;
      color: #61718a;
      font-size: 14px;
    }
    .step.done b {
      background: #13a66a;
      color: white;
    }
    .step.active {
      color: #1976e8;
      font-weight: 700;
    }
    .step.active b {
      background: #1976e8;
      color: white;
    }
    .hero {
      text-align: center;
      margin-bottom: 28px;
    }
    .icon {
      width: 72px;
      height: 72px;
      background: #e8f2ff;
      color: #1976e8;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 32px;
      margin: 0 auto 16px;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 10px;
      font-weight: 800;
    }
    .subtitle {
      color: #657792;
      font-size: 16px;
      line-height: 1.45;
      margin: 0;
    }
    .phone-shown {
      font-weight: 700;
      color: #17233b;
      margin-top: 4px;
    }
    .label {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 12px;
      display: block;
    }
    .code-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 22px;
    }
    .code-row input {
      width: 58px;
      height: 58px;
      border: 2px solid #d3e2f4;
      border-radius: 12px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      outline: none;
      transition: border-color .15s;
    }
    .code-row input:focus {
      border-color: #1976e8;
      box-shadow: 0 0 0 3px #1976e820;
    }
    .code-row input.error {
      border-color: #ef5350;
    }
    .resend {
      text-align: center;
      font-size: 14px;
      color: #71809a;
      margin-bottom: 28px;
    }
    .resend button {
      border: 0;
      background: none;
      color: #1976e8;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      font-size: 14px;
    }
    .resend button:disabled {
      color: #a0aec0;
      cursor: default;
    }
    .error-msg {
      display: none;
      text-align: center;
      color: #dc3d48;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .error-msg.show {
      display: block;
    }
    .go {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 12px;
      background: #1976e8;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .go:disabled {
      opacity: 0.55;
      cursor: default;
    }
    .go:hover:not(:disabled) {
      filter: brightness(0.96);
    }
    .back {
      display: block;
      width: 100%;
      border: 0;
      background: none;
      color: #1976e8;
      margin-top: 16px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
      text-align: center;
    }
    .success {
      display: none;
      text-align: center;
      padding: 20px 0;
    }
    .success.show {
      display: block;
    }
    .success-icon {
      width: 64px;
      height: 64px;
      background: #eafaf3;
      color: #13a66a;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 28px;
      margin: 0 auto 14px;
    }
    @media (max-width: 520px) {
      .page {
        margin: 0;
        border-radius: 0;
        min-height: 100vh;
        padding: 24px 18px 32px;
      }
      h1 { font-size: 24px; }
      .code-row input {
        width: 52px;
        height: 52px;
        font-size: 22px;
      }
      .steps { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="logo">
      <div class="logo-icon">↗</div>
      <span>Возврат звонков</span>
    </div>

    <div class="steps">
      <div class="step done"><b>✓</b>Регистрация</div>
      <div class="step active"><b>2</b>Подключение</div>
      <div class="step"><b>3</b>Настройка</div>
      <div class="step"><b>4</b>Готово</div>
    </div>

    <div id="form-block">
      <div class="hero">
        <div class="icon">📱</div>
        <h1>Подтвердите номер</h1>
        <p class="subtitle">
          Мы отправили SMS с кодом на номер<br>
          <span class="phone-shown" id="phone-display">+380 67 123 45 67</span>
        </p>
      </div>

      <label class="label">Код из SMS</label>
      <div class="code-row">
        <input type="tel" maxlength="1" inputmode="numeric" id="c1" autocomplete="one-time-code">
        <input type="tel" maxlength="1" inputmode="numeric" id="c2">
        <input type="tel" maxlength="1" inputmode="numeric" id="c3">
        <input type="tel" maxlength="1" inputmode="numeric" id="c4">
      </div>

      <div class="error-msg" id="error">Неверный код. Попробуйте ещё раз.</div>

      <div class="resend">
        Не пришло сообщение?<br>
        <button id="resend-btn" disabled>Отправить код ещё раз (0:<span id="timer">45</span>)</button>
      </div>

      <button class="go" id="confirm-btn" disabled>Подтвердить номер →</button>
      <button class="back" onclick="history.back()">← Изменить номер</button>
    </div>

    <div class="success" id="success">
      <div class="success-icon">✓</div>
      <h1>Номер подтверждён</h1>
      <p class="subtitle">Переходим к настройке авто-ответа…</p>
    </div>
  </div>

  <script>
    const inputs = [c1, c2, c3, c4];
    const confirmBtn = document.getElementById('confirm-btn');
    const errorEl = document.getElementById('error');
    const resendBtn = document.getElementById('resend-btn');
    const timerEl = document.getElementById('timer');
    let timeLeft = 45;
    let timerInterval;

    // Автопереход между полями
    inputs.forEach((input, i) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/\D/g, '');
        e.target.value = val;
        if (val && i < 3) inputs[i + 1].focus();
        checkCode();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && i > 0) {
          inputs[i - 1].focus();
        }
      });

      // Вставка из буфера (SMS autofill)
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 4);
        paste.split('').forEach((char, idx) => {
          if (inputs[idx]) inputs[idx].value = char;
        });
        if (paste.length === 4) inputs[3].focus();
        checkCode();
      });
    });

    function getCode() {
      return inputs.map(i => i.value).join('');
    }

    function checkCode() {
      const code = getCode();
      confirmBtn.disabled = code.length !== 4;
      errorEl.classList.remove('show');
      inputs.forEach(i => i.classList.remove('error'));
    }

    confirmBtn.onclick = () => {
      const code = getCode();
      // Для демо правильный код — 4821
      if (code === '4821') {
        document.getElementById('form-block').style.display = 'none';
        document.getElementById('success').classList.add('show');
        setTimeout(() => {
          window.location.href='/auto-reply';
        }, 1200);
      } else {
        errorEl.classList.add('show');
        inputs.forEach(i => i.classList.add('error'));
      }
    };

    // Таймер повторной отправки
    function startTimer() {
      timeLeft = 45;
      resendBtn.disabled = true;
      timerEl.textContent = timeLeft;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft < 10 ? '0' + timeLeft : timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          resendBtn.disabled = false;
          resendBtn.innerHTML = 'Отправить код ещё раз';
        }
      }, 1000);
    }

    resendBtn.onclick = () => {
      if (resendBtn.disabled) return;
      alert('Код отправлен повторно');
      startTimer();
      resendBtn.innerHTML = 'Отправить код ещё раз (0:<span id="timer">45</span>)';
      // Обновляем ссылку на timer после перезаписи HTML
      document.getElementById('timer').textContent = '45';
    };

    // Старт
    c1.focus();
    startTimer();
  </script>
</body>
</html>
